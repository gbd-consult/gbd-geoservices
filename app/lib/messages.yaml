# The texts a person reads: the landing page, the devtools, and in time the
# API's error messages. One entry per message id, one text per language of the
# `languages` option; `lib/i18n.py` reads it, and `test_i18n.py` refuses an
# entry that lacks one. `{name}` is a placeholder, filled by `i18n.t(...)`.
#
# Ids are `<where>.<what>`. Not here: anything a client parses -- JSON keys,
# mode, parameter, theme and grid names, URLs -- which is the same in every
# language.

# A language's name in itself, for the switch between them.
language.name:
  de: Deutsch
  en: English

