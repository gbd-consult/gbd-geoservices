# Importance per category, 0-100 -- the scale of `ranking.relevance`. Hand-written.
#
#   100  essential: what people look for by name; first in search results
#    80  major landmark or destination
#    60  everyday destination
#    40  neighbourhood-level
#    20  incidental: named, but rarely what anyone looks for
#     0  ignored: never found by search, even with a name, and never drawn as an icon
#
# Keys are any node of model/generated/categories.yaml, at any depth. A node without an entry
# inherits its nearest listed ancestor's value, so the three top levels must be listed. A key
# that is no node is refused (importer/rules.py): generated ids follow iD's preset names, and a
# stale one would otherwise silently do nothing.
#
# Changing a value needs a re-import: the importer writes it onto every row. Which importance
# gets an icon from which zoom is styling, per detail: styles/details.yaml `symbols`.
# See DESIGN.md "Importance".

