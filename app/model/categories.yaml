# The category tree: what an object is, for search and for its icon. Hand-written;
# tools/gen_classifier.py reads it and writes model/generated/categories.yaml (the deep
# tree, with names and search terms from iD) and model/generated/classifier.yaml.
#
# id: `cat_` plus segments joined with `_`; a segment never contains `_` itself.
# presets: iD preset ids (id-tagging-schema, the version gen_classifier.py pins). An id
#   stands for that preset and every preset below it, unless a more specific id is listed
#   at another node. Every preset a node claims becomes a child of it in the deep tree,
#   nested the way iD nests them -- except where a node lists exactly one preset: that
#   preset is the node itself.
# main: the one of `presets` that is the node itself: its objects are filed at the node, and
#   its search terms are the node's; the other presets become children. A node that lists
#   exactly one preset needs none -- that preset is the node.
# name_en / name_de: display names. A generated child takes its names from iD.
# marker: presets below get a POI class, one per second-level category (cls_poi_food), where
#   OpenMapTiles counts them as a POI -- and so a marker with the category's icon. Inherited;
#   set on cat_poi and on the few built/geography nodes that are dotted too (parking, fuel,
#   stops, ...). Which icon, and whether it is drawn, is styles/icons.yaml.
# How important a category is -- search order, and which icons a theme draws from which zoom --
# is model/importance.yaml.
#
# See DESIGN.md "The category tree".

