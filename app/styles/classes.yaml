# Appearance per mode, class and zoom. Under each mode, a key is "<class> <zoom>" or just "<class>".
# A zoom key holds until the next key of the same class and mode; later keys override single
# properties. A key without a zoom applies at every zoom the class is drawn in that mode.
#
# The lowest zoom a class has in fill, line or casing is where it starts: the importer writes it
# into every row's minzoom (and the band tables are built from it), so moving it earlier takes a
# re-import. The lowest in label, shield or number is where its text starts, which the importer writes into
# minzoom_label. Marker keys need no zoom: from which zoom an icon and its label are drawn is the
# row's importance (model/importance.yaml) and the theme's detail (details.yaml `symbols`).
#
# `defaults` are applied under every entry of their mode. `templates` holds YAML anchors and is
# not read otherwise: `{<<: *name, ...}` merges one, `{<<: [*a, *b], ...}` several (the earlier
# wins a key both have; the entry's own keys win over all of them).
# Colors are tokens from palettes.yaml, never literals. Fonts are named only by the first three
# templates, and everything else merges them: Noto Sans is what the image installs.

templates:
  regular: &regular {font: Noto Sans Regular}
  bold: &bold {font: Noto Sans Bold}
  italic: &italic {font: Noto Sans Italic}
  
  halo: &halo {halo: clr_halo, halo-radius: halo_radius}
  halo_place: &halo_place {halo: clr_halo, halo-radius: halo_radius_place}
  halo_road: &halo_road {halo: clr_halo, halo-radius: halo_radius_road}
  
  line_label: &line_label {placement: line, spacing: 400}
  water_label: &water_label {<<: [*italic, *halo], size: 10, fill: clr_label_water}
  water_line_label: &water_line_label {<<: [*water_label, *line_label]}
  road_label: &road_label {<<: [*regular, *halo_road, *line_label], fill: clr_label_road}
  rail_label: &rail_label {<<: [*regular, *halo, *line_label], fill: clr_label_rail, spacing: 600}
  area_label: &area_label {<<: [*regular, *halo], size: 10, wrap: 60}
  
  place_1: &place_1 {<<: [*regular, *halo_place], wrap: 70, fill: clr_label}
  place_2: &place_2 {<<: [*regular, *halo_place], wrap: 70, fill: clr_label}
  place_3: &place_3 {<<: [*regular, *halo_place], fill: clr_label_minor}
  place_4: &place_4 {<<: [*italic, *halo_place], fill: clr_label_minor}
  
  minor_label: &minor_label {<<: [*regular, *halo], fill: clr_label_minor}
  # The text is in marker mode on purpose: it is drawn with its icon, as one shield, or not at
  # all -- never a label whose icon lost its spot. `size` is the icon's there, `text-size` the text's.
  poi_label: &poi_label {<<: [*regular, *halo], text: name, text-size: 10, dy: 17, wrap: 60}

defaults:
  label: {text: name}
  shield: {<<: [*bold, *halo_place], text: label, size: 9, fill: clr_label_road, placement: line, spacing: 600}
  # One class per second-level category; the icon and its colour are the row's (styles/icons.yaml).
  marker: {icon: true, size: 27}

'*':
