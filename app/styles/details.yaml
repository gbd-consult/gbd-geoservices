    - cls_water_*
    - cls_waterway_*
    - cls_road_motorway*
    - cls_road_trunk*
    - cls_road_primary*
    - cls_road_secondary*
    - cls_road_tertiary*
    - cls_rail_rail*
    - cls_boundary_admin_2
    - cls_boundary_admin_4
    - cls_place_city
    - cls_place_town
    - cls_place_village
