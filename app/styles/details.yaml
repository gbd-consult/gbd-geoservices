    - cls_coastline
    - cls_ferry
    - cls_landcover_*
    - cls_landuse_*
    - cls_protected_area
    - cls_water_*
    - cls_waterway_*
    - cls_contour*
    - cls_road_*
    - cls_rail_*
    - cls_transit_*
    - cls_aeroway_*
    - cls_building
    - cls_boundary_admin_2
    - cls_boundary_admin_4
    - cls_boundary_admin_6
    - cls_boundary_admin_8
    - cls_place_*
    - cls_public_transport_path
  symbols:
    icons: {100: 17, 80: 17, 60: 18}
    labels: {60: 18}
vegetation:
  classes:
    - cls_ocean
    - cls_coastline
    - cls_landcover_*
