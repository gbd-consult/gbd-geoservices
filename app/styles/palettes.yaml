# Palettes keyed by name: token -> color, plus the few numeric tokens that differ per palette.
# Every palette defines every token classes.yaml uses; the generator refuses a gap.
# A token set to `none` leaves out whatever is painted with it.
# `clr_land` is the map background (Mapnik Map background-color); `casing_scale` multiplies every
# line-width drawn in casing mode; `halo_radius*` are used as halo-radius values.
# light is default lifted towards white. grayscale and sepia are default's luminance, raised to the
# power 1.5 so the light area colors stay apart, mapped onto black-white and dark brown-paper.
# atkis takes the layer colors of the ATKIS signature catalogue SK25 (AdV, DTK25), for the
# `topographic` detail: Waldgrün for wood and scrub, Wiesengrün, Parkgrün, Ackerocker (also
# vineyards), Brachbraun for heath and bog, Seeblau/Bachblau, Wohnflächenhellrot,
# Industrieflächengrau, Gebäudegrau, Straßenorange for motorway, trunk and primary (Autobahn,
# Bundesstraße), Straßengelb for secondary (Landesstraße), white for the rest, Grundrissbraun casings
# and paths, black rail and text, violet boundaries, Reliefbraun contours. SK25 has no fill for
# protected and military areas, only their boundaries.
# flora, for the `vegetation` detail, colors the vegetation units by formation: needleleaved,
# broadleaved and mixed wood, scrub, heath (violet), grassland, orchard and vineyard, arable land,
# marsh and reed (blue-green), bog (peat brown); urban green (park, pitch, cemetery) greyed as
# anthropogenic, unvegetated ground neutral, everything else default 60 % desaturated.
# Every palette gives the vegetation units the classifier tells apart (wood by leaf type, scrub,
# heath, grass, wetland, bog, orchard) colors of their own, by formation -- heath violet, wetland
# blue-green, bog peat brown -- so the `vegetation` detail shows them; contours are relief brown.
