# Icons per category, their colour, and whether the map draws them. Styling, not model: changing this file
# needs `manage.py compile-styles`, never a re-import. The importer writes every point's own category
# into osm_point.category; `manage.py compile-styles` resolves this file for every category of
# model/generated/categories.yaml, writes one SVG per (icon, colour) pair and palette, and sets
# osm_point.icon and osm_label.icon to that pair's key -- NULL where the category is not drawn. The marker layer
# reads `<icons>/<palette>/[icon].svg` and skips NULL.
#
# Each file is styles/icons/template.svg filled in: a white disc, a disc in the category's
# `color` (a palettes.yaml token, one file per palette) and the icon in white on top.
# A category without an entry inherits its nearest listed ancestor's icon, colour and `draw`
# flag, so every category has all three. `draw: no` gives the category's points no icon: they get
# no marker, and search results still show the icon.
# Paths are relative to styles/icons/: maki/ (Mapbox Maki, CC0) and generic/ (our own, for a
# POI with no icon of its own -- a filled ring, as Google Maps draws one).
# See DESIGN.md "Icons".

