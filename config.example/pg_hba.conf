# Client authentication for the deployed stack -- the template for
# config/pg_hba.conf. docker-compose.yml mounts it next to postgresql.conf,
# whose hba_file= points here.
#
# local: only reachable from inside the postgres container, i.e. by whoever
# can already `docker exec` on the host. It is what makes the operator's
# `docker compose exec postgres psql -U geoservices geoservices` work
# without the password, and what the image's init scripts use.
local   all  all                  trust
# Everything else is the app, over the compose network, with the password.
# Docker's address pools; nothing outside the host reaches this server,
# since postgres publishes no port.
host    all  all  127.0.0.1/32    scram-sha-256
host    all  all  172.16.0.0/12   scram-sha-256
host    all  all  192.168.0.0/16  scram-sha-256
host    all  all  10.0.0.0/8      scram-sha-256
