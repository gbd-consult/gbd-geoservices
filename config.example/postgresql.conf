# PostgreSQL for the deployed stack -- the template for config/postgresql.conf.
# docker-compose.yml starts postgres with config_file= pointing here, so this
# is the *whole* configuration: anything not set is the server's built-in
# default, not initdb's generated file (which lies unused in pgdata).
#
# Read when postgres starts: a change takes `manage.sh restart`, which stops
# the whole stack and starts it again.

# The app reaches it as postgres:5432 inside the compose network. Nothing is
# published outside it: Docker's rules run ahead of ufw. Without '*' the server listens on the container's loopback only.
listen_addresses = '*'
# pg_hba.conf is mounted next to this file; the compose file names only this one.
hba_file = '/etc/postgresql/pg_hba.conf'
max_connections = 100
dynamic_shared_memory_type = posix

# Sized for the host.
shared_buffers = 2GB
work_mem = 64MB
maintenance_work_mem = 1GB
max_parallel_workers_per_gather = 2
max_wal_size = 4GB
min_wal_size = 80MB

# A measured finding, not a preference: the JIT costs 50-150 ms on every
# low-zoom query.
jit = off

# No fsync = off, full_page_writes = off or synchronous_commit = off: those are
# the dev stack's shortcut (config.local/). This database is not reseeded on
# every run, and a crash must not corrupt it.

timezone = 'Etc/UTC'
log_timezone = 'Etc/UTC'
datestyle = 'iso, mdy'

logging_collector = off
log_line_prefix = '%t %c %a %r '

# Statements over 5 s are logged, the tile layers' included (Mapnik runs its
# own SQL, so this is the only place a slow layer query shows up by name).
# Their plans are not: auto_explain.log_min_duration = 1s would log them,
# with actual rows and buffers; log_timing off keeps the per-node clock calls
# off every other query. Both take effect with pg_reload_conf(); auto_explain
# itself is loaded at server start.
log_min_duration_statement = 5s
shared_preload_libraries = 'auto_explain'
auto_explain.log_min_duration = -1
auto_explain.log_analyze = on
auto_explain.log_buffers = on
auto_explain.log_timing = off
auto_explain.log_format = text
