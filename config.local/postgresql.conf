# PostgreSQL for the dev stack. docker-compose.local.yml starts postgres with
# config_file= pointing here, so this is the whole configuration.
# config.example/postgresql.conf is the production template; the difference
# is the durability trio at the end.

# Reached from the app container and, through the published port
# 7778, from the host and the test stack (the profilers, psql).
listen_addresses = '*'
# pg_hba.conf is mounted next to this file; the compose file names only this one.
hba_file = '/etc/postgresql/pg_hba.conf'
max_connections = 100
dynamic_shared_memory_type = posix

shared_buffers = 2GB
work_mem = 64MB
maintenance_work_mem = 1GB
max_parallel_workers_per_gather = 2
max_wal_size = 4GB
min_wal_size = 80MB

# Not a dev shortcut: the JIT was measured to cost 50-150 ms on every
# low-zoom query. Kept identical to production so profiles compare.
jit = off

timezone = 'Etc/UTC'
log_timezone = 'Etc/UTC'
datestyle = 'iso, mdy'

logging_collector = off
log_line_prefix = '%t %c %a %r '

# Dev only: every statement with its duration, and every connection, to
# stderr (`docker logs gbd-geoservices-03-postgres`). Loud; not in config/.
# log_min_duration_statement = 0
# log_connections = on
# log_disconnections = on

# The dev shortcut, and only here: this database is reseeded from scratch on
# every import, so durability across a crash buys nothing, and these make
# the import's COPY and index builds cheaper. Never in config/.
fsync = off
full_page_writes = off
synchronous_commit = off
