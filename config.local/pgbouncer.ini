; pgbouncer for the dev stack. docker-compose.local.yml mounts it into the
; pgbouncer container; config.example/pgbouncer.ini is the production
; template, and the two are the same.

[databases]
; Every database the app asks for, on postgres.
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
; No password from clients: a SCRAM exchange per connection is most of what
; pgbouncer is here to save, and Mapnik connects once per layer. Safe only
; because nothing untrusted reaches this port (DESIGN.md "Deployment").
auth_type = trust
; Still read with trust: the user must be listed, and its password is what
; pgbouncer logs in to postgres with, over SCRAM. The compose file writes it
; from postgres.env when the container starts.
auth_file = /tmp/pgbouncer_auth_file
; Every client keeps its backend for as long as it is connected, so nothing
; the app does needs to know pgbouncer is there.
pool_mode = session
max_client_conn = 500
; Below postgresql.conf's max_connections, with room for psql.
default_pool_size = 80
; Mapnik connects once per layer: two lines per layer, per Map load.
log_connections = 0
log_disconnections = 0
